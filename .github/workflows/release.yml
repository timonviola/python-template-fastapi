name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment strategy.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv (Rust)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run quality checks
        run: |
          uv run prek run --all-files
          uv run basedpyright --project basedpyrightconfig.json
          uv run pytest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cocogitto
        run: cargo install --locked cocogitto

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        run: |
          if [ "${{ github.event.inputs.increment }}" = "auto" ]; then
            cog bump --auto --changelog
          else
            cog bump --increment "${{ github.event.inputs.increment }}" --changelog
          fi

      - name: Collect release metadata
        id: release_meta
        run: |
          tag="$(git describe --tags --abbrev=0)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          cog changelog --at "${tag}" > release-notes.md

      - name: Push release commit and tags
        run: git push --follow-tags

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          body_path: release-notes.md
