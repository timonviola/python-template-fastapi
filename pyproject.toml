[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI template with strict typing and repository pattern."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-logging>=0.65b0",
  "opentelemetry-sdk>=1.44.0",
  "pydantic>=2.8.0,<3.0.0",
  "uvicorn[standard]>=0.52.3,<1.0.0",
]

[project.scripts]
dev = "fastapi_template.main:run_dev"

[dependency-groups]
dev = [
  "basedpyright>=1.39.10,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-material>=9.6.18,<10.0.0",
  "mkdocstrings[python]>=1.0.6,<2.0.0",
  "prek>=0.4.14,<1.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_template"]

[tool.pytest.ini_options]
addopts = "-q --cov=fastapi_template --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src/fastapi_template"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN", "N"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true
