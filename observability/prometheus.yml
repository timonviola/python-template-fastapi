global:
  scrape_interval: 10s

# Allow Grafana Tempo's metrics-generator to remote_write span/service-graph
# metrics into Prometheus.
storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
