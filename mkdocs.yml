site_name: FastAPI Template
site_description: Developer documentation for the FastAPI template.
site_url: https://python-template.tmon.xyz/

theme:
  name: material
  icon:
    logo: material/rocket-launch
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_root_toc_entry: true
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/export_openapi.py

nav:
  - Home: index.md
  - API Reference:
      - Configuration: reference/config.md
      - Application: reference/main.md
      - Routes: reference/routes.md
      - Services: reference/services.md
      - Repositories: reference/repositories.md
      - Domain: reference/domain.md
  - OpenAPI reference: openapi.md
